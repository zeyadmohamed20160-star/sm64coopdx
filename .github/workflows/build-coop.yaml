name: Build Saturn iOS

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ] 

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev zip
      - name: Build the game
        run: make -j$(nproc)
      - name: Generate hash
        run: |
          cd tools
          g++ -std=c++17 -o hash_file hash_file.cpp
          echo "::notice ::$(./hash_file ../build/us_pc/saturn)"
      - name: Zip the game
        run: |
          cd ./build/us_pc
          zip -r saturn_Linux.zip dynos lang mods palettes saturn
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-linux
          path: ./build/us_pc/saturn_Linux.zip

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >
            unzip
            make
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-SDL2
            python3
            zip 
      - name: Build the game
        run: make -j$(nproc)
      - name: Generate hash
        run: |
          cd tools
          g++ -std=c++17 -o hash_file.exe hash_file.cpp
          echo "::notice ::$(./hash_file.exe ../build/us_pc/saturn.exe)"
      - name: Zip the game
        run: |
          cd ./build/us_pc
          zip -r saturn_Windows.zip dynos lang mods palettes saturn.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: saturn-windows
          path: ./build/us_pc/saturn_Windows.zip

  build-ios-ipad:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools via Brew
        run: |
          echo "=========================================================="
          echo "INSTALLING HOMEBREW DEPENDENCIES"
          echo "=========================================================="
          brew install make pkg-config coreutils sdl2 glew

      - name: Complete Custom Audio Purge Patch
        run: |
          echo "=========================================================="
          echo "OBLITERATING ALL CUSTOM SFX TRACKS ENTIRELY"
          echo "=========================================================="
          # Finds and drops every directory matching custom audio paths to prevent tool calls
          find sound/samples/ -type d -name "*custom*" -exec rm -rf {} + || echo "Clean"
          
          # Force re-creates the base empty structures so the engine scripts don't drop out on path checks
          mkdir -p sound/samples/sfx_custom_luigi
          mkdir -p sound/samples/sfx_custom_mario
          mkdir -p sound/samples/sfx_custom_peach
          mkdir -p sound/samples/sfx_custom_toad
          mkdir -p sound/samples/sfx_custom_wario
          mkdir -p sound/samples/sfx_custom_yoshi
          mkdir -p sound/samples/sfx_custom_luigi_peach
          
          echo "Custom assets neutralized successfully."

      - name: Compile Source targeting iOS Mobile
        run: |
          echo "=========================================================="
          echo "LAUNCHING CORE ENG COMPILATION RUN VIA ALL SYSTEM CORES"
          echo "=========================================================="
          make TARGET_IOS=1 -j$(sysctl -n hw.ncpu)

      - name: Package Application Bundle into IPA
        run: |
          echo "=========================================================="
          echo "STRUCTURING SECURE APPLICATION BUNDLE PAYLOAD"
          echo "=========================================================="
          mkdir -p Payload
          
          if [ -d "build/us_pc/saturn.app" ]; then
            echo "Packaging verified saturn.app target payload profile..."
            cp -r build/us_pc/saturn.app Payload/
          elif [ -d "build/us_pc/sm64coopdx.app" ]; then
            echo "Packaging verified sm64coopdx.app target payload profile..."
            cp -r build/us_pc/sm64coopdx.app Payload/
          else
            echo "Attempting raw application metadata block discovery sweeps..."
            cp -r build/us_pc/*.app Payload/ || echo "Compilation binary target tree missing structure."
          fi
          
          echo "Compressing file streams down into flashable zip binary..."
          zip -r saturn_iPad.ipa Payload

      - name: Upload Finished iPad IPA Installer
        uses: actions/upload-artifact@v4
        with:
          name: saturn-ipad-bundle
          path: saturn_iPad.ipa

