name: Build Saturn ipa

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ] 

jobs:
  build-ios-ipad:
    name: Build Saturn iPad Installer (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          echo "=========================================================="
          echo "INSTALLING HOMEBREW TOOLS"
          echo "=========================================================="
          # Core dependencies for Mac/iOS builds
          brew install make pkg-config coreutils sdl2 glew

      - name: Clean and Pre-Generate Folder Structure
        run: |
          echo "=========================================================="
          echo "PRE-GENERATING ALL BUILD PATHS"
          echo "=========================================================="
          # Parallel builds often fail if directories are missing during sound extraction
          mkdir -p build/us_pc/sound/samples/sfx_custom_luigi
          mkdir -p build/us_pc/sound/samples/sfx_custom_luigi_peach
          mkdir -p build/us_pc/sound/samples/sfx_custom_mario
          mkdir -p build/us_pc/sound/samples/sfx_custom_peach
          mkdir -p build/us_pc/sound/samples/sfx_custom_toad
          mkdir -p build/us_pc/sound/samples/sfx_custom_wario
          mkdir -p build/us_pc/sound/samples/sfx_custom_yoshi
          mkdir -p tools

      - name: Build Native Host Tools (Fixes Error 127)
        run: |
          echo "=========================================================="
          echo "COMPILING EXTRACTION TOOLS FOR MAC HOST"
          echo "=========================================================="
          # We build the tools FOLDER first without iOS flags so the tools can run on the Mac server
          make -C tools -j$(sysctl -n hw.ncpu)

      - name: Compile Saturn for iOS
        run: |
          echo "=========================================================="
          echo "STARTING CORE iOS COMPILATION"
          echo "=========================================================="
          # We use the built-in TARGET_IOS=1 to enable touch controls and mobile layout
          # We use -j to speed up the process with all available CPU cores
          make TARGET_IOS=1 -j$(sysctl -n hw.ncpu)

      - name: Structure IPA Payload
        run: |
          echo "=========================================================="
          echo "PACKAGING APP BUNDLE INTO IPA"
          echo "=========================================================="
          mkdir -p Payload
          # Search for the app folder whether it's named saturn.app, sm64coopdx.app, or generic
          if [ -d "build/us_pc/saturnapp" ]; then
            cp -r build/us_pc/saturn.app Payload/
          elif [ -d "build/us_pc/smcoopdxapp" ]; then
            cp -r build/us_pc/sm64coopdx.app Payload/
          else
            cp -r build/us_pc/*.app Payload/ || echo "Warning: No .app folder found!"
          fi
          # Create the final .ipa file
          zip -r saturn_iPad.ipa Payload

      - name: Upload Saturn iPad Bundle
        uses: actions/upload-artifact@v4
        with:
          name: saturn-ipad-bundle
          path: saturn_iPad.ipa

  # Windows build included for your project completeness
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: unzip make git mingw-w64-x86_64-gcc mingw-w64-x86_64-glew mingw-w64-x86_64-SDL2 python3 zip 
      - name: Build
        run: make -j$(nproc)
      - name: Zip Windows Artifact
        run: |
          cd ./build/us_pc
          zip -r saturn_Windows.zip *.exe
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-windows
          path: ./build/us_pc/saturn_Windows.zip

  # Linux build included for your project completeness
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev zip
      - name: Build
        run: make -j$(nproc)
      - name: Zip Linux Artifact
        run: |
          cd ./build/us_pc
          zip -r saturn_Linux.zip saturn sm64coopdx
      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: saturn-linux
          path: ./build/us_pc/saturn_Linux.zip
